<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WebRush turns music history, transactions and places into a browsable feed of receipts, then surfaces the connections hiding between them — entirely in the browser."
    />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="WebRush — Your Life, In Receipts" />
    <meta
      property="og:description"
      content="Every moment becomes an itemised receipt. Receipts close in time, place, people or sequence become linked."
    />
    <meta property="og:type" content="website" />
    <title>WebRush — Your Life, In Receipts</title>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme
      (function () {
        try {
          var stored = localStorage.getItem('webrush-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
